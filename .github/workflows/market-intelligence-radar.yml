name: Autonomous Market Intelligence & Trend Radar

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      focus_area:
        description: 'Target Industrial Cluster or Domain Focus'
        required: false
        default: 'Indian MSME & Automotive/Engineering Manufacturing Inventory Intelligence'

permissions:
  contents: write
  issues: write
  models: read

jobs:
  market-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Execute Market Intelligence Radar Script
        env:
          FOCUS_AREA: ${{ github.event.inputs.focus_area || 'Indian MSME & Automotive/Engineering Manufacturing Inventory Intelligence' }}
        run: node scripts/market-radar.mjs

      - name: Commit Updated Strategic Report
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/market-intelligence/latest-market-radar.md
          git commit -m "chore(radar): update strategic market intelligence report [skip ci]" || true
          git push origin master || true

      - name: Create Actionable PRD Issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "[Radar PRD] Indian MSME Working Capital & Dead Stock Optimization Engine" --label "agent-ready-spec" --body "Indian MSME Working Capital & Dead Stock Optimization Engine PRD for DeadStockAnalysis.tsx." || true
