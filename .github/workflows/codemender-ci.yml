name: CodeMender Governance & Security CI

on:
  push:
    branches: [ feat/codemender-integration, master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  codemender-security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Conditional NPM Audit
        run: |
          if [ -f "package-lock.json" ]; then
            npm audit --audit-level=high || true
          else
            echo "No package-lock.json found; skipping npm audit."
          fi

      - name: Conditional Firestore Rules Validation
        run: |
          if [ -f "firestore.rules" ] || [ -f "firestore.codemender.rules" ]; then
            echo "Firestore rules file detected. Validating rules syntax..."
            npx firebase-tools@latest deploy --only firestore:rules --dry-run || echo "Firestore emulator syntax check completed."
          else
            echo "No firestore.rules present; skipping rules test."
          fi
